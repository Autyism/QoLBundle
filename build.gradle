plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu: optional at runtime for players. Compiled against for the "configure" button,
	// and loaded in the dev client so that button can be tested.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// The X-ray add-on is a second, separate mod built from src/xray: its own modid, its own jar
// (build/libs/qolbundle-xray-addon-<version>.jar). It is never part of the main jar.
sourceSets {
	xray {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	// Tells the dev client which folders belong to which mod.
	mods {
		"qolbundle" {
			sourceSet sourceSets.main
		}
		"qolbundle_xray" {
			sourceSet sourceSets.xray
		}
	}
	runs {
		client {
			// The dev client includes the X-ray add-on; `-PnoAddon` runs the main mod alone.
			source project.hasProperty("noAddon") ? sourceSets.main : sourceSets.xray
			// `.\gradlew runClient -Pselftest` switches on the automated self-test.
			if (project.hasProperty("selftest")) {
				vmArg "-Dqol.selftest=true"
				// `-Pselftest=name1,name2` runs only those scenarios.
				if (project.property("selftest")) {
					vmArg "-Dqol.selftest.only=${project.property('selftest')}"
				}
			}
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

processXrayResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	// Source files contain Chinese text (tests, comments); never depend on the system code page.
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// The add-on's jar: first packed with the readable (dev) names, then translated to the names the
// real game uses, the same two steps Loom does for the main jar.
def xrayJar = tasks.register("xrayJar", Jar) {
	from sourceSets.xray.output
	from("LICENSE") {
		rename { "${it}_qolbundle_xray" }
	}
	archiveBaseName = "${project.archives_base_name}-xray-addon"
	archiveClassifier = "dev"
	destinationDirectory = layout.buildDirectory.dir("devlibs")
}

def remapXrayJar = tasks.register("remapXrayJar", net.fabricmc.loom.task.RemapJarTask) {
	inputFile = xrayJar.flatMap { it.archiveFile }
	archiveBaseName = "${project.archives_base_name}-xray-addon"
	addNestedDependencies = false
	classpath.from(sourceSets.xray.compileClasspath)
}

tasks.named("assemble") {
	dependsOn remapXrayJar
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}